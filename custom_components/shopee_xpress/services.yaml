track_parcel:
  fields:
    tracking_code:
      required: true
      example: "SPXID000000000000"
      selector:
        text:
    market:
      required: false
      example: "ID"
      selector:
        select:
          options:
            - "BR"
            - "ID"
            - "MY"
            - "PH"
            - "TH"
            - "TW"
            - "VN"
    contents:
      required: false
      example: "Running shoes"
      selector:
        text:

untrack_parcel:
  fields:
    tracking_code:
      required: true
      example: "SPXID000000000000"
      selector:
        text:

update_contents:
  fields:
    tracking_code:
      required: true
      example: "SPXID000000000000"
      selector:
        text:
    contents:
      required: false
      example: "Running shoes"
      selector:
        text:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: shopee_xpress
