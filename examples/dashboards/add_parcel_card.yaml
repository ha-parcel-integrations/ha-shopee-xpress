# Add a Shopee Xpress parcel straight from a dashboard — no diving into the options.
#
# The integration exposes two services:
#   - shopee_xpress.track_parcel   (tracking_code)
#   - shopee_xpress.untrack_parcel (tracking_code)
#
# This example wires a text field + a button on a Lovelace card to
# shopee_xpress.track_parcel. It needs one helper and one script (below), then the card.
#
# Tracking more than one market? Add a `market: "ID"` line under `data:` in
# the script below (or a second helper + script pair) — the service only
# defaults to the single hub when exactly one is set up.

# ---------------------------------------------------------------------------
# 1) Helper — Settings → Devices & Services → Helpers → Create → Text,
#    or in configuration.yaml:
# ---------------------------------------------------------------------------
input_text:
  shopee_xpress_new_parcel:
    name: New Shopee Xpress tracking code
    max: 30

# ---------------------------------------------------------------------------
# 2) Script — reads the text field, tracks the parcel, then clears the field.
#    Add to scripts.yaml (or Settings → Automations & Scenes → Scripts).
# ---------------------------------------------------------------------------
shopee_xpress_track_new_parcel:
  alias: "Shopee Xpress: track the parcel in the input box"
  sequence:
    - condition: template
      value_template: "{{ states('input_text.shopee_xpress_new_parcel') | trim != '' }}"
    - action: shopee_xpress.track_parcel
      data:
        tracking_code: "{{ states('input_text.shopee_xpress_new_parcel') | trim }}"
    - action: input_text.set_value
      target:
        entity_id: input_text.shopee_xpress_new_parcel
      data:
        value: ""

# ---------------------------------------------------------------------------
# 3) Lovelace card — paste into a dashboard (Edit → raw config, or add a
#    manual card). Type the number, press the button.
# ---------------------------------------------------------------------------
