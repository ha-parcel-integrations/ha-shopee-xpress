# Notify when a Shopee Xpress parcel goes out for delivery.

alias: "Shopee Xpress: out for delivery"
description: Notify when a tracked Shopee Xpress parcel is loaded for delivery today.
mode: queued
max: 10

triggers:
  - trigger: event
    event_type: shopee_xpress_parcel_status_changed

conditions:
  - condition: template
    value_template: "{{ trigger.event.data.new_status == 'out_for_delivery' }}"

actions:
  - action: notify.mobile_app
    data:
      title: "Shopee Xpress on the way"
      message: >-
        {{ trigger.event.data.sender or trigger.event.data.barcode }}
        is being delivered today.
      # No clickAction: this carrier's payload never carries a tracking URL
      # in any market (unlike most carriers in this suite), so `data.url`
      # is always None — add one back if that ever changes.
