# Extract Shopee Xpress tracking codes from incoming e-mail and register them
# with `shopee_xpress.track_parcel`, so parcels start tracking the moment the
# shipping confirmation lands in your inbox — no manual entry.
#
# Requirements:
#   - one or more core IMAP config entries with "text" enabled under
#     "message data" and the max message size raised (carrier mails are
#     long) — full setup guide and pitfalls: track_parcels_from_email.md
#   - optional: an `ai_task` entity for the AI fallback branch; delete
#     the whole `else:` block if you don't use one
#   - PRIVACY: by default this fires on EVERY incoming mail and (with the
#     AI branch) can send mail bodies to your AI Task. Scope the IMAP
#     search to the carrier's sender first — see "Scope & privacy" in the .md.
#
# The regex is deliberately written without backslashes (`(?<![0-9A-Za-z])`
# instead of `\b`, `[0-9]` instead of `\d`): Jinja treats `\b` inside a
# string literal as a backspace escape, so the pattern would silently
# never match.

alias: "Shopee Xpress: track from e-mail"
description: >-
  Listens to imap_content events from all IMAP entries. Fast regex path for
  Shopee Xpress tracking codes; optional AI fallback for mails whose layout the
  regex does not recognise.
mode: queued
max: 10

triggers:
  - trigger: event
    event_type: imap_content

variables:
  sender: "{{ trigger.event.data.sender | default('') | lower }}"
  subject: "{{ trigger.event.data.subject | default('') }}"
  body: "{{ trigger.event.data.text | default('') }}"
  content: "{{ subject ~ ' ' ~ body }}"
  # Shopee Xpress spx_tn prefixes seen across six markets: 2 letters (BR, MY,
  # TH) and 5 letters (SPEPH = Philippines, SPXID = Indonesia,
  # SPXVN = Vietnam) — add your own market's prefix to the alternation if it
  # isn't one of these six. A pure-digit order number also resolves but is
  # deliberately not matched here — it looks like any other number in the
  # mail body, so the AI fallback is the safer route for that case.
  shopee_xpress_codes: >-
    {{ content | regex_findall('(?<![0-9A-Za-z])(?:BR|MY|TH|SPEPH|SPXID|SPXVN)[0-9A-Za-z]{8,}')
       | unique | list }}
  # Keyword gate for the AI fallback — localise to your language(s).
  is_parcel_mail: >-
    {{ content | lower is search('pakket|bezorg|track|verzonden|onderweg|zending|shipment|delivery|levering') }}

conditions:
  # initial=true means "new message"; false means a duplicate trigger of
  # the SAME message (e.g. after a reconnect) — requiring it is free dedup.
  - condition: template
    value_template: "{{ trigger.event.data.initial | default(true) }}"
  - condition: template
    value_template: "{{ is_parcel_mail or shopee_xpress_codes | count > 0 }}"

actions:
  - repeat:
      for_each: "{{ shopee_xpress_codes }}"
      sequence:
        - action: shopee_xpress.track_parcel
          data:
            tracking_code: "{{ repeat.item }}"
  - if:
      - condition: template
        value_template: "{{ shopee_xpress_codes | count > 0 }}"
    then:
      - action: notify.mobile_app_your_phone
        data:
          title: "📦 Shopee Xpress parcel picked up from mail"
          message: >-
            {{ shopee_xpress_codes | join(', ') }} (mail from {{ sender }})
    else:
      # ---- Optional AI fallback — delete this block if you have no ai_task entity ----
      - action: ai_task.generate_data
        data:
          task_name: shopee_xpress-tracking-code-extraction
          entity_id: ai_task.your_ai_task_entity
          instructions: >-
            Below is an e-mail. Determine whether it contains a Shopee Xpress
            (SPX) parcel tracking code. Shopee Xpress codes are 2-5 uppercase
            letters followed by 10-13 digits and an optional trailing letter
            (e.g. MY000000000000, SPXID000000000000R) — but a plain numeric
            order number can also be a valid Shopee Xpress reference, so
            don't discard a number-only match out of hand. Only return a real
            tracking or order reference, never a customer or invoice number.
            If the mail is from a different carrier, answer 'other'. When in
            doubt: 'none'.

            Sender: {{ sender }}
            Subject: {{ subject }}
            Body:
            {{ body[:6000] }}
          structure:
            carrier:
              description: Whether a Shopee Xpress tracking code was found
              required: true
              selector:
                select:
                  options: ["shopee_xpress", "other", "none"]
            tracking_code:
              description: The tracking code, or empty if none
              required: false
              selector:
                text:
        response_variable: ai_result
      - choose:
          - conditions: "{{ ai_result.data.carrier == 'shopee_xpress' and (ai_result.data.tracking_code | default('') | trim) != '' }}"
            sequence:
              - action: shopee_xpress.track_parcel
                data:
                  tracking_code: "{{ ai_result.data.tracking_code | trim }}"
              - action: notify.mobile_app_your_phone
                data:
                  title: "📦 Shopee Xpress parcel picked up from mail (AI)"
                  message: "{{ ai_result.data.tracking_code | trim }} (mail from {{ sender }})"
          - conditions: "{{ ai_result.data.carrier == 'other' and (ai_result.data.tracking_code | default('') | trim) != '' }}"
            sequence:
              - action: notify.mobile_app_your_phone
                data:
                  title: "📦 Tracking number found – not a Shopee Xpress parcel"
                  message: "{{ ai_result.data.tracking_code | trim }} (mail from {{ sender }}, subject: {{ subject }})"
